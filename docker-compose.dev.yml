services:
  api:
    image: node:22-bookworm-slim
    working_dir: /app
    command: npm run dev:api
    environment:
      NODE_ENV: development
      PORT: 3001
      HOST: 0.0.0.0
      DATABASE_PATH: /app/data/incident-board.db
      SEED_ON_BOOT: "true"
      CORS_ORIGIN: http://localhost:5173
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.2:3b
      AI_ENABLED: "true"
      LOG_LEVEL: debug
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
    ports:
      - "3001:3001"

  web:
    image: node:22-bookworm-slim
    working_dir: /app
    command: npm run dev:web -- --host 0.0.0.0 --port 5173
    environment:
      API_PROXY_TARGET: http://api:3001
    volumes:
      - .:/app
    ports:
      - "5173:5173"
    depends_on:
      - api
