services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      DATABASE_PATH: /data/incident-board.db
      SEED_ON_BOOT: "true"
      CORS_ORIGIN: http://localhost:8080
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.2:3b
      AI_ENABLED: "true"
      LOG_LEVEL: info
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - incident-data:/data
    ports:
      - "3001:3001"

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  incident-data:
